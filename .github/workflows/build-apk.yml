name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare web files
        run: |
          mkdir -p www
          if [ -f index.html ]; then
            cp index.html www/index.html
          else
            cp "$(ls *.html | head -1)" www/index.html
          fi

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Generate app icon
        run: |
          mkdir -p assets
          cp icon.png assets/icon.png
          npx --yes @capacitor/assets@3 generate --android --iconBackgroundColor '#000000'

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk XINGQIU.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XINGQIU
          path: XINGQIU.apk
